<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<title>Mad Minute Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Mad Minute Hub: one home-screen icon that opens every Mad Minute app.
     To add an app: add one entry to APPS below (and its icon to sw.js). -->
<style>
  :root {
    --bg: #12161b; --panel: #1c232b; --panel-2: #242d37; --line: rgba(255,255,255,0.08);
    --text: #e8edf2; --text-dim: #8b96a3; --amber: #f2a73b; --teal: #3fb8ae;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2f4f6; --panel: #ffffff; --panel-2: #e8ecf0; --line: rgba(20,25,30,0.1);
            --text: #171c21; --text-dim: #5b6672; --amber: #c97c0a; --teal: #1f8a81; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 "Space Grotesk", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  h1 span { color: var(--amber); }
  .sub { color: var(--text-dim); margin: 2px 0 6px; }
  h2 { margin: 14px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); }
  a.app {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
  }
  a.app:active { transform: scale(0.99); }
  a.app:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  a.app.demo { border-color: var(--amber); }
  .app img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
  .app .t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .app b { font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .app .d { font-size: 13px; color: var(--text-dim); }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--bg); background: var(--amber); border-radius: 6px; padding: 2px 6px; }
  .go { color: var(--text-dim); font-size: 20px; flex: none; }
  .foot { font-size: 12px; color: var(--text-dim); text-align: center; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Mad<span>Minute</span></h1>
    <div class="sub">Every subject in one place. Tap one to open it.</div>
  </div>
  <div id="list"></div>
  <div class="foot">A Mana Industries product</div>
</main>
<script>
  // group, link, icon, name, what it covers, badge
  var APPS = [
    ["Trades", "../", "../icons/icon-192.png", "Auto", "Automotive, maintenance, 12 V, CAN bus and high voltage", "DEMO"],
    ["Trades", "../neta/", "../neta/icons/icon-192.png", "NETA", "Electrical testing and commissioning, Level 1 to 4"],
    ["Learning", "../dev/", "../dev/icons/icon-192.png", "Dev", "From first code to junior full-stack and DevOps"],
    ["Learning", "../biology/", "../biology/icons/icon-192.png", "Biology", "College general biology"],
    ["Learning", "../music/", "../music/icons/icon-192.png", "Music", "Theory, ear training, sight singing, keyboard, history"]
  ];
  var html = "", last = "";
  APPS.forEach(function (a) {
    if (a[0] !== last) { html += "<h2>" + a[0] + "</h2>"; last = a[0]; }
    html += '<a class="app' + (a[5] ? " demo" : "") + '" href="' + a[1] + '">' +
      '<img src="' + a[2] + '" alt="">' +
      '<span class="t"><b>Mad Minute ' + a[3] + (a[5] ? ' <span class="tag">' + a[5] + '</span>' : "") + '</b>' +
      '<span class="d">' + a[4] + '</span></span>' +
      '<span class="go" aria-hidden="true">›</span></a>';
  });
  document.getElementById("list").innerHTML = html;
  // keep the gaps between groups even
  Array.prototype.forEach.call(document.querySelectorAll("#list > a"), function (el) { el.style.marginTop = "8px"; });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
